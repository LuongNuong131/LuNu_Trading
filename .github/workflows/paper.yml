name: Paper acceptance
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend_trading_core/requirements.txt
      - name: Install on Windows
        if: runner.os == 'Windows'
        run: cmd /c setup_windows.cmd
      - name: Install on Linux
        if: runner.os == 'Linux'
        run: python -m venv .venv && .venv/bin/python -m pip install -r backend_trading_core/requirements.txt
      - name: Test and replay on Windows
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: backend_trading_core
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c run_windows.cmd demo --no-browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path .\demo_output\report.html)) { throw 'Offline report was not generated' }
      - name: Launch paper from CMD
        if: runner.os == 'Windows'
        env:
          MARKET_FEED_ENABLED: 'false'
          OMNI_QUANT_DB_PATH: ./data/windows-smoke.sqlite3
        run: |
          $process = Start-Process -FilePath $env:ComSpec -ArgumentList '/d', '/c', 'run_windows.cmd', 'paper', '--no-browser' -PassThru -WindowStyle Hidden
          try {
            $response = $null
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/dashboard' -TimeoutSec 2
                break
              } catch {
                if ($process.HasExited) { throw 'CMD exited before starting the dashboard' }
                Start-Sleep -Seconds 1
              }
            }
            if ($response.StatusCode -ne 200 -or $response.Content -notmatch 'LuNu Trading') {
              throw 'Paper dashboard was not reachable'
            }
          } finally {
            if (!$process.HasExited) {
              taskkill /PID $process.Id /T /F
            }
          }
      - name: Test and replay on Linux
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: backend_trading_core
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python backend_trading_core/run_backend.py --demo
