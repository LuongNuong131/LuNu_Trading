name: Paper acceptance
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend_trading_core/requirements.txt
      - name: Install on Windows
        if: runner.os == 'Windows'
        run: cmd /c setup_windows.cmd
      - name: Install on Linux
        if: runner.os == 'Linux'
        run: python -m venv .venv && .venv/bin/python -m pip install -r backend_trading_core/requirements.txt
      - name: Test and replay on Windows
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: backend_trading_core
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe backend_trading_core\run_backend.py --demo
      - name: Test and replay on Linux
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: backend_trading_core
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python backend_trading_core/run_backend.py --demo
