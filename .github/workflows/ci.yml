name: LuNu Trading CI

on:
  push:
  pull_request:

jobs:
  paper-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas
      - run: python -m compileall -q backend_trading_core tests
      - run: PYTHONPATH=backend_trading_core python -m unittest discover -s tests -v
      - name: Reject tracked secrets and local state
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.sqlite3?$|.*\.duckdb$|__pycache__|\.pyc$)'; then
            echo 'Sensitive or generated files are tracked.'
            exit 1
          fi
